<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Burdwan Car Rental — Your Local Ride</title>
<meta name="description" content="Book local rentals, airport transfers, one-way, round-trip and outstation cabs. Request a booking online and get it confirmed by our team.">
<link rel="canonical" href="https://kcm2112007.github.io/Burdwan-Car-Rental---Your-Local-Ride/">
<meta property="og:title" content="Burdwan Car Rental — Your Local Ride">
<meta property="og:description" content="Book local rentals, airport transfers, one-way, round-trip and outstation cabs.">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1C1F22">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%231C1F22'/%3E%3Cpath d='M14 40l4-12a6 6 0 0 1 5.7-4h16.6a6 6 0 0 1 5.7 4l4 12' stroke='%23D98B1E' stroke-width='3' fill='none' stroke-linecap='round'/%3E%3Ccircle cx='22' cy='42' r='4' fill='%23D98B1E'/%3E%3Ccircle cx='42' cy='42' r='4' fill='%23D98B1E'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --ink:#1C1F22; --ink-soft:#4A4F55;
  --paper:#F6F5F1; --surface:#FFFFFF; --line:#E3E1DA;
  --accent:#D98B1E; --accent-deep:#8A5A0F; --accent-ink:#3A2705;
  --success:#2F7D5A; --success-bg:#E8F3ED;
  --danger:#B33A3A; --danger-bg:#FBEBEA;
  --info:#2B6CB0; --info-bg:#E9F1FA;
  --warn:#9A6B14; --warn-bg:#FBF1DE;
  --radius:10px; --radius-lg:16px;
  --shadow:0 1px 2px rgba(28,31,34,.06),0 8px 24px rgba(28,31,34,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;color:var(--ink);background:var(--paper);line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:'Fraunces',serif;font-weight:600;line-height:1.15;margin:0 0 .4em}
a{color:inherit}
img{max-width:100%;display:block}
button{font-family:inherit}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
.narrow{max-width:640px}

/* ===== Buttons ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 22px;border-radius:999px;border:1px solid transparent;font-weight:600;font-size:15px;cursor:pointer;text-decoration:none;transition:transform .15s ease,box-shadow .15s ease}
.btn-primary{background:var(--ink);color:#fff}
.btn-primary:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
.btn-accent{background:var(--accent);color:var(--accent-ink)}
.btn-accent:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
.btn-outline{background:transparent;border-color:var(--line);color:var(--ink)}
.btn-outline:hover{border-color:var(--ink)}
.btn-ghost{background:transparent;color:var(--ink-soft);padding:8px 12px}
.btn-sm{padding:8px 14px;font-size:13px;border-radius:8px}
.btn-danger{background:var(--danger-bg);color:var(--danger)}
.btn-block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none!important}

/* ===== Top nav ===== */
.topbar{position:sticky;top:0;z-index:40;background:rgba(246,245,241,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex;align-items:center;justify-content:space-between;height:64px}
.brand{display:flex;align-items:center;gap:10px;font-family:'Fraunces',serif;font-weight:700;font-size:19px;letter-spacing:-.01em}
.brand svg{flex:none}
.nav-links{display:flex;gap:26px;font-size:14.5px;font-weight:500}
.nav-links a{opacity:.8}
.nav-links a:hover{opacity:1}
.topbar-actions{display:flex;gap:10px;align-items:center}
.hide-mobile{display:none}
@media(min-width:860px){.hide-mobile{display:flex}}

/* ===== Hero ===== */
.hero{position:relative;padding:56px 0 40px;overflow:hidden}
.hero .wrap{display:grid;gap:34px}
@media(min-width:900px){.hero .wrap{grid-template-columns:1.1fr .9fr;align-items:center}}
.eyebrow-route{display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--ink-soft);margin-bottom:16px}
.eyebrow-route .dot{width:8px;height:8px;border-radius:50%;background:var(--accent)}
.eyebrow-route .dash{flex:0 0 40px;height:1px;background:repeating-linear-gradient(90deg,var(--ink-soft) 0 6px,transparent 6px 11px)}
.hero h1{font-size:clamp(32px,5.2vw,52px);letter-spacing:-.02em;max-width:12ch}
.hero p.lead{font-size:17px;color:var(--ink-soft);max-width:46ch;margin:14px 0 26px}
.hero-cta-row{display:flex;flex-wrap:wrap;gap:12px}
.hero-stats{display:flex;gap:28px;margin-top:32px;flex-wrap:wrap}
.hero-stats div b{display:block;font-family:'Fraunces',serif;font-size:24px}
.hero-stats div span{font-size:12.5px;color:var(--ink-soft)}
.route-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:22px;box-shadow:var(--shadow)}
.route-svg{width:100%;height:auto}
.trip-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:16px}
@media(min-width:520px){.trip-grid{grid-template-columns:repeat(3,1fr)}}
.trip-chip{border:1px solid var(--line);border-radius:10px;padding:12px 8px;text-align:center;font-size:13px;font-weight:600;cursor:pointer;background:#fff}
.trip-chip:hover{border-color:var(--accent)}

/* ===== Sections ===== */
section{padding:52px 0}
.section-head{max-width:560px;margin-bottom:30px}
.section-head p{color:var(--ink-soft);margin-top:8px}
.grid{display:grid;gap:18px}
.grid-2{grid-template-columns:1fr}
@media(min-width:760px){.grid-2{grid-template-columns:1fr 1fr}}
.grid-3{grid-template-columns:1fr}
@media(min-width:640px){.grid-3{grid-template-columns:1fr 1fr}}
@media(min-width:960px){.grid-3{grid-template-columns:repeat(3,1fr)}}
.grid-4{grid-template-columns:repeat(2,1fr)}
@media(min-width:900px){.grid-4{grid-template-columns:repeat(4,1fr)}}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px}
.icon-badge{width:38px;height:38px;border-radius:9px;background:var(--warn-bg);display:flex;align-items:center;justify-content:center;color:var(--accent-deep);margin-bottom:12px;font-size:18px}
.route-list a{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.route-list a:last-child{border-bottom:none}
.pill{font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--info-bg);color:var(--info)}

.step-row{display:flex;gap:16px;align-items:flex-start}
.step-num{flex:none;width:34px;height:34px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-size:14px}
.step-line{width:1px;flex:1;background:var(--line);margin:6px 0 6px 17px}

.review-card p{font-style:normal;color:var(--ink-soft);font-size:14.5px}
.stars{color:var(--accent);font-size:14px;margin-bottom:8px}

.faq-item{border-bottom:1px solid var(--line)}
.faq-q{width:100%;text-align:left;background:none;border:none;padding:16px 0;font-weight:600;font-size:15px;display:flex;justify-content:space-between;cursor:pointer}
.faq-a{max-height:0;overflow:hidden;transition:max-height .2s ease}
.faq-a p{padding-bottom:16px;color:var(--ink-soft);font-size:14.5px;margin:0}
.faq-item.open .faq-a{max-height:200px}

footer{background:var(--ink);color:#E9E8E4;padding:44px 0 28px;margin-top:20px}
footer .wrap{display:grid;gap:28px}
@media(min-width:760px){footer .wrap{grid-template-columns:2fr 1fr 1fr 1fr}}
footer a{opacity:.75;font-size:13.5px;display:block;margin-bottom:8px}
footer a:hover{opacity:1}
footer h4{color:#fff;font-size:13px;font-family:'Inter',sans-serif;font-weight:600;letter-spacing:.02em;margin-bottom:12px}
.foot-bottom{border-top:1px solid rgba(255,255,255,.12);margin-top:26px;padding-top:18px;font-size:12.5px;opacity:.6;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}

/* ===== Forms ===== */
.field{margin-bottom:16px}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
.field .hint{font-size:12px;color:var(--ink-soft);margin-top:4px}
.field .err{font-size:12px;color:var(--danger);margin-top:4px;display:none}
.field.invalid input,.field.invalid select,.field.invalid textarea{border-color:var(--danger)}
.field.invalid .err{display:block}
input,select,textarea{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:9px;font-size:15px;font-family:inherit;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
.field-row{display:grid;gap:14px}
@media(min-width:600px){.field-row.two{grid-template-columns:1fr 1fr}}

/* ===== Booking flow ===== */
.booking-shell{max-width:640px;margin:0 auto;padding:32px 20px 80px}
.progress-track{display:flex;gap:6px;margin-bottom:28px}
.progress-track span{flex:1;height:4px;border-radius:2px;background:var(--line)}
.progress-track span.done{background:var(--accent)}
.trip-option{border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;cursor:pointer;background:#fff}
.trip-option.selected{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.trip-option b{display:block;font-size:15px}
.trip-option span{font-size:12.5px;color:var(--ink-soft)}
.vehicle-option{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px;cursor:pointer;background:#fff;display:flex;justify-content:space-between;align-items:center}
.vehicle-option.selected{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.summary-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.summary-row:last-child{border:none}
.summary-row b{font-weight:600}
.sticky-actions{position:sticky;bottom:0;background:linear-gradient(180deg,transparent,var(--paper) 30%);padding:16px 0 4px;margin-top:10px}
.step-actions{display:flex;gap:10px;margin-top:22px}

/* ===== Status timeline ===== */
.timeline{list-style:none;margin:0;padding:0}
.timeline li{position:relative;padding:0 0 22px 30px;font-size:14px}
.timeline li:before{content:'';position:absolute;left:5px;top:4px;width:11px;height:11px;border-radius:50%;background:var(--line);border:2px solid var(--paper)}
.timeline li:after{content:'';position:absolute;left:10px;top:16px;bottom:0;width:1px;background:var(--line)}
.timeline li:last-child:after{display:none}
.timeline li.active:before{background:var(--accent)}
.timeline li.past:before{background:var(--success)}
.timeline li time{display:block;font-size:11.5px;color:var(--ink-soft);margin-top:2px}

.badge{display:inline-flex;align-items:center;padding:4px 10px;border-radius:999px;font-size:11.5px;font-weight:600}
.badge.status-Request-Received,.badge.status-Searching-for-Vehicle,.badge.status-Awaiting-Confirmation{background:var(--warn-bg);color:var(--warn)}
.badge.status-Partner-Assigned,.badge.status-Confirmed,.badge.status-Driver-Vehicle-Assigned,.badge.status-Trip-Started{background:var(--info-bg);color:var(--info)}
.badge.status-Completed{background:var(--success-bg);color:var(--success)}
.badge.status-Cancelled{background:var(--danger-bg);color:var(--danger)}

/* ===== Auth cards ===== */
.auth-shell{max-width:400px;margin:60px auto;padding:0 20px}
.auth-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius-lg);padding:28px;box-shadow:var(--shadow)}
.auth-switch{text-align:center;font-size:13.5px;margin-top:16px;color:var(--ink-soft)}
.auth-switch button{background:none;border:none;color:var(--accent-deep);font-weight:600;cursor:pointer;padding:0}

/* ===== Dashboards (shared shell) ===== */
.dash-shell{display:flex;min-height:100vh;background:var(--paper)}
.dash-side{width:220px;flex:none;background:var(--ink);color:#E9E8E4;padding:20px 14px;display:none}
@media(min-width:880px){.dash-side{display:block}}
.dash-side .brand{color:#fff;padding:6px 8px 24px}
.dash-nav a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;font-size:14px;color:#C9C7C1;text-decoration:none;margin-bottom:2px;cursor:pointer}
.dash-nav a:hover{background:rgba(255,255,255,.06);color:#fff}
.dash-nav a.active{background:rgba(217,139,30,.16);color:#fff}
.dash-main{flex:1;min-width:0}
.dash-topbar{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line);padding:14px 20px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.dash-mobile-tabs{display:flex;overflow-x:auto;gap:6px;padding:10px 14px;background:var(--surface);border-bottom:1px solid var(--line)}
@media(min-width:880px){.dash-mobile-tabs{display:none}}
.dash-mobile-tabs a{flex:none;font-size:13px;font-weight:600;padding:8px 13px;border-radius:999px;background:var(--paper);border:1px solid var(--line);cursor:pointer;white-space:nowrap}
.dash-mobile-tabs a.active{background:var(--ink);color:#fff;border-color:var(--ink)}
.dash-body{padding:20px}
@media(min-width:700px){.dash-body{padding:28px}}

.stat-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px}
.stat-card .label{font-size:12px;color:var(--ink-soft);margin-bottom:6px}
.stat-card .value{font-family:'Fraunces',serif;font-size:24px}
.stat-card .sub{font-size:11.5px;color:var(--ink-soft);margin-top:4px}

.panel{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:20px}
.panel-head{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.panel-head h3{margin:0;font-size:16px}
.panel-body{padding:16px 18px}

.toolbar{display:flex;flex-wrap:wrap;gap:8px;padding:12px 18px;border-bottom:1px solid var(--line);background:#FBFAF7}
.toolbar input,.toolbar select{width:auto;padding:8px 10px;font-size:13.5px}
.toolbar input[type=text]{min-width:170px;flex:1}

table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-soft);padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
tr:hover td{background:#FBFAF7}
.table-scroll{overflow-x:auto}
.row-actions{display:flex;gap:6px}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:12.5px}

.empty-state{text-align:center;padding:50px 20px;color:var(--ink-soft)}
.empty-state .icon-badge{margin:0 auto 14px}

/* Cards-on-mobile for bookings (alt view) */
.mobile-cards{display:grid;gap:10px}
@media(min-width:880px){.mobile-cards{display:none}}
.table-scroll.desktop-only{display:none}
@media(min-width:880px){.table-scroll.desktop-only{display:block}}
.bcard{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px}
.bcard-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.bcard b{font-size:14px}
.bcard .meta{font-size:12.5px;color:var(--ink-soft);margin:2px 0}

/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(20,20,20,.5);display:flex;align-items:flex-end;justify-content:center;z-index:100;padding:0}
@media(min-width:700px){.modal-bg{align-items:center;padding:20px}}
.modal{background:#fff;width:100%;max-width:640px;max-height:92vh;overflow-y:auto;border-radius:16px 16px 0 0;padding:22px}
@media(min-width:700px){.modal{border-radius:16px}}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.modal-head h3{margin:0}
.close-x{background:var(--paper);border:none;width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:16px}

.tag{font-size:11px;font-weight:600;padding:2px 8px;border-radius:6px}
.tag.verified{background:var(--success-bg);color:var(--success)}
.tag.unverified{background:var(--warn-bg);color:var(--warn)}
.tag.inactive{background:var(--danger-bg);color:var(--danger)}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:999px;font-size:13.5px;z-index:200;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-6px)}

.sticky-cta{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:12px 16px;z-index:30;display:flex}
@media(min-width:900px){.sticky-cta{display:none}}

.legal-body h2{font-size:20px;margin-top:28px}
.legal-body p,.legal-body li{color:var(--ink-soft);font-size:14.5px}
.notice-box{background:var(--warn-bg);color:var(--accent-ink);border-radius:10px;padding:14px 16px;font-size:13.5px;margin-bottom:18px}

.two-col-auth{display:none}
[hidden]{display:none!important}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal-root"></div>
<div id="toast-root"></div>

<script>
window.APP_LIMITATIONS = true; // see README — client-side demo data layer
</script>

</script>
</body>
</html>
